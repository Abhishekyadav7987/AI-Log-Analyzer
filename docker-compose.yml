services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: log_analyzer
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: on-failure
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: on-failure
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
  api-gateway:
    build: { context: ., dockerfile: apps/api-gateway/Dockerfile }
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/log_analyzer?schema=public
      - KAFKA_BROKER=kafka:29092
      - REDIS_URL=redis://redis:6379
    ports: ["3000:3000"]
    depends_on: [postgres, redis, kafka]
  log-service:
    build: { context: ., dockerfile: apps/log-service/Dockerfile }
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/log_analyzer?schema=public
      - KAFKA_BROKER=kafka:29092
    ports: ["3001:3001"]
    depends_on: [postgres, kafka]
  anomaly-service:
    build: { context: ., dockerfile: apps/anomaly-service/Dockerfile }
    env_file: .env
    environment:
      - KAFKA_BROKER=kafka:29092
    depends_on: [kafka]
  ticket-service:
    build: { context: ., dockerfile: apps/ticket-service/Dockerfile }
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/log_analyzer?schema=public
      - KAFKA_BROKER=kafka:29092
    depends_on: [postgres, kafka]
  ai-service:
    build: { context: ., dockerfile: apps/ai-service/Dockerfile }
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/log_analyzer?schema=public
      - KAFKA_BROKER=kafka:29092
      - OLLAMA_URL=http://ollama:11434
    depends_on: [postgres, kafka, ollama]
  action-service:
    build: { context: ., dockerfile: apps/action-service/Dockerfile }
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/log_analyzer?schema=public
      - KAFKA_BROKER=kafka:29092
    ports: ["3005:3005"]
    depends_on: [postgres, kafka]
  websocket-gateway:
    build: { context: ., dockerfile: apps/websocket-gateway/Dockerfile }
    env_file: .env
    environment:
      - KAFKA_BROKER=kafka:29092
    ports: ["3006:3006"]
    depends_on: [kafka]
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3007:3000"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
